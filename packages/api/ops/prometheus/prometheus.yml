global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ecommerce-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: ecommerce-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
